# Builds, scans and publishes this service's image when a version tag is pushed.
# Needs the CORE_REPO_TOKEN secret (read-only on the private sentinel-core repo).
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/api-sentinel-team/api-sentinel-scheduler
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        env:
          DOCKER_BUILDKIT: "1"
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          printf '%s' "$CORE_REPO_TOKEN" > /tmp/gh_token
          docker build --secret id=gh_token,src=/tmp/gh_token -f Dockerfile -t "$IMAGE:${GITHUB_REF_NAME}" .
          rm -f /tmp/gh_token
      - name: Scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image             --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${GITHUB_REF_NAME}"
      - name: Push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_REF_NAME}"
