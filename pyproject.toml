[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentinel-scheduler"
version = "0.3.1"
description = "API Sentinel scheduler service"
requires-python = ">=3.11"
dependencies = [
  "sentinel-core @ git+https://github.com/API-Sentinel-Team/api-sentinel-core.git@v0.3.1",
  "APScheduler>=3.10,<4.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.2.0",
  "pytest-asyncio==0.23.6",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["sentinel_scheduler*"]
